<!doctype html><meta charset="utf-8"><title>demo</title><style>
  html,body{margin:0}
  .bg{position:fixed;inset:0;background:url(store/hn-hi.png) center/cover no-repeat}
  .frame{position:fixed;inset:0;border:3px solid transparent;border-radius:2px;pointer-events:none}
  .frame.on{border-color:rgba(147,51,234,.75)}
  #pill{position:fixed;bottom:8px;right:8px;background:#9333ea;color:#fff;font:12px system-ui,sans-serif;padding:3px 10px;border-radius:11px;box-shadow:0 1px 4px rgba(0,0,0,.4);user-select:none}
  #pill .dim{opacity:.75}
  #cursor{position:fixed;z-index:2147483647;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
  #ripple{position:fixed;z-index:2147483647;pointer-events:none;border:3px solid rgba(147,51,234,.9);border-radius:50%}
</style>
<div class="bg" id="bg"></div>
<div class="frame" id="frame"></div>
<svg id="cursor" width="20" height="20" viewBox="0 0 20 20" style="display:none">
  <path d="M3 1v16l3.9-3.7 2.3 5.5 2.8-1.2-2.4-5.4 5.6-.6z" fill="#9333ea" stroke="#fff" stroke-width="1.3"/>
</svg>
<div id="ripple" style="display:none"></div>
<div id="pill"><span id="label">🟣 AI idle</span><span class="dim"> ✕</span><span class="dim"> ⏏</span></div>
<script>
// Frame-exact replay of a real driven sequence — the same strings, colors and
// layout the shipped pill uses (extension/background.js). ?f=N renders frame N
// (5 fps loop); window.render(f) sets it without a reload for capture.
// Target of the scripted click: the first story's "comments" link in the
// 1280x800 hn-hi.png backdrop (displayed 1:1).
const CLICK_X = 285, CLICK_Y = 70;
const FRAMES = 44;
function render(f) {
  f = ((f % FRAMES) + FRAMES) % FRAMES;
  const label = document.getElementById('label');
  const frame = document.getElementById('frame');
  const cur = document.getElementById('cursor');
  const rip = document.getElementById('ripple');
  const bg = document.getElementById('bg');
  cur.style.display = 'none'; rip.style.display = 'none';
  frame.className = 'frame'; bg.style.backgroundPosition = 'center';
  let text = '🟣 AI idle';
  if (f < 3) { text = '🟣 opening page…'; frame.classList.add('on'); }
  else if (f < 8) { text = '🟣 reading page… ' + (f - 2) + 's'; frame.classList.add('on'); }
  else if (f < 11) { text = '🟣 AI idle'; }
  else if (f < 15) { // click: cursor glides to the link, pill narrates
    text = '🟣 clicking "153 comments"…'; frame.classList.add('on');
    const t = (f - 11) / 3, x = 1100 + (CLICK_X - 1100) * t, y = 700 + (CLICK_Y - 700) * t;
    cur.style.display = 'block'; cur.style.left = x + 'px'; cur.style.top = y + 'px';
  } else if (f < 18) { // ripple lands
    text = '🟣 clicked "153 comments"'; frame.classList.add('on');
    const t = (f - 15) / 2, d = 28 + 16 * t;
    rip.style.display = 'block'; rip.style.width = rip.style.height = d + 'px';
    rip.style.left = (CLICK_X - d / 2) + 'px'; rip.style.top = (CLICK_Y - d / 2) + 'px';
    rip.style.opacity = 1 - t * 0.7;
    cur.style.display = 'block'; cur.style.left = CLICK_X + 'px'; cur.style.top = CLICK_Y + 'px';
  } else if (f < 21) { text = '🟣 AI idle'; }
  else if (f < 26) { text = '🟣 taking screenshot… ' + (f - 20) + 's'; frame.classList.add('on'); }
  else if (f < 29) { text = '🟣 AI idle'; }
  else if (f < 36) { // scroll: backdrop pans up
    text = '🟣 scrolling…'; frame.classList.add('on');
    bg.style.backgroundPosition = 'center ' + (-(f - 29) * 60) + 'px';
  }
  label.textContent = text;
}
render(Number(new URLSearchParams(location.search).get('f') || 0));
</script>
