<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>stress slow change</title>
</head>
<body>
  <h1>Slow change page</h1>
  <button id="arm" onclick="arm()">Arm the 3s change</button>
  <div id="target" style="margin:100px; width:200px; height:150px; background:#fff;">target</div>
  <script>
    function arm () {
      setTimeout(() => {
        document.getElementById('target').style.background = '#2b2';
      }, 3000);
    }
  </script>
</body>
</html>
