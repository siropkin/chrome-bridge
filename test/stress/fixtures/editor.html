<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>stress editor</title>
<style>div[contenteditable] { border: 1px solid #999; min-height: 1.4em; margin: 8px; padding: 4px; }</style>
</head>
<body>
  <h1>Block-editor behaviors that broke type (#29/#30/#32)</h1>

  <!-- #30: the framework REPLACES the caret's block node on the first input
       and re-places the caret in the fresh node — but focus falls back to
       body. Old code threw 'element detached mid-typing' and dropped the
       remaining payload; the caret-follow must keep typing into the fresh
       node. -->
  <div id="rewrite" contenteditable="true"></div>

  <!-- #29: heavy framework pipeline — every input event costs ~1.2s of
       synchronous work. 60 chars ≈ 74s > the old flat 70s command cap. -->
  <div id="heavy" contenteditable="true"></div>

  <!-- #34: two editor-owned shapes. #owned preventDefaults beforeinput
       deletions (the editor wants deletions through its own model) — on this
       shape the native Selection+execCommand delete still empties the text.
       #hardowned reproduces the vc.ru symptom exactly: execCommand('delete')
       returns false and nothing is deleted — clear's DOM-removal fallback is
       the only way out. Both reconcile their model via MutationObserver. -->
  <div id="owned" contenteditable="true"><p>block one</p><p>block two</p></div>
  <div id="owned-model">blocks: 2</div>
  <div id="hardowned" contenteditable="true"><p>stubborn one</p><p>stubborn two</p></div>
  <div id="hardowned-model">blocks: 2</div>
  <input id="plain" value="prefilled value">

  <script>
    (() => {
      const rw = document.getElementById('rewrite');
      rw.addEventListener('input', () => {
        const old = document.getElementById('rewrite');
        if (!old) return;
        const fresh = old.cloneNode(false);
        fresh.textContent = old.textContent; // keep what landed so far
        old.replaceWith(fresh);
        // caret at the end of the fresh node, focus NOT restored (vc.ru shape)
        const r = document.createRange();
        r.selectNodeContents(fresh); r.collapse(false);
        const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      }, { once: true });

      document.getElementById('heavy').addEventListener('input', () => {
        const t0 = performance.now();
        while (performance.now() - t0 < 1200); // the framework's per-keystroke bill
      });

      // #34 fixture logic: the editors own all deletions…
      for (const id of ['owned', 'hardowned']) {
        const ed = document.getElementById(id);
        ed.addEventListener('beforeinput', (e) => {
          if (e.inputType.startsWith('delete')) e.preventDefault(); // model-driven editor declines raw deletes
        });
        // …and reconcile their model from DOM mutations (what clear relies on)
        new MutationObserver(() => {
          document.getElementById(id + '-model').textContent = 'blocks: ' + ed.querySelectorAll('p').length + ' · text: ' + JSON.stringify(ed.textContent);
        }).observe(ed, { childList: true, subtree: true, characterData: true });
      }
      // #hardowned: the vc.ru observation — delete is not even enabled for the
      // editor's selection state, so execCommand returns false having done
      // nothing. Scoped to calls made while THIS editor is focused so the
      // #owned test above still exercises the genuine native path.
      const origExec = document.execCommand.bind(document);
      document.execCommand = (cmd, ...rest) => {
        const ae = document.activeElement;
        if (cmd === 'delete' && ae && ae.id === 'hardowned') return false;
        return origExec(cmd, ...rest);
      };
    })();
  </script>
</body>
</html>
