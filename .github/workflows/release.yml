# Release pipeline: triggered when a `v*` tag is pushed.
#
# Steps:
#   1. Verify extension/manifest.json AND package.json versions match the tag
#   2. Build a clean extension zip (manifest.json at zip root — CWS requirement)
#   3. Create a GitHub Release: annotated-tag message as the body (it is the
#      release record — there is no CHANGELOG), commit notes appended, zip attached
#   4. (Optional) Upload to the Chrome Web Store as a draft
#
# To enable Chrome Web Store auto-upload, set repository variable
# CHROME_PUBLISH=true and add four secrets:
#   CHROME_EXTENSION_ID  — listing id from the developer dashboard URL
#   CHROME_CLIENT_ID     — OAuth client id (Google Cloud Console)
#   CHROME_CLIENT_SECRET — OAuth client secret
#   CHROME_REFRESH_TOKEN — refresh token from the Web Store API quickstart
# First listing upload must be manual via the dashboard (one-time $5 dev fee).
#
# A PENDING REVIEW locks the item: draft uploads then fail with
# ITEM_NOT_UPDATABLE (the store accepts one submission at a time). The
# 'Unblock' step below cancels a pending submission before uploading (the tag
# being released is always newer than whatever is under review). It needs a
# fifth secret, CHROME_PUBLISHER_ID (the id in the developer-dashboard URL) —
# without it the step is a no-op and the old warn-and-continue behavior holds.
# Submitting for review stays a MANUAL click: auto-submitting would restart
# the review clock on every tag, so during a release burst nothing would ever
# finish review.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify versions match tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          MANIFEST=$(node -p "require('./extension/manifest.json').version")
          PACKAGE=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$MANIFEST" ] || [ "$TAG" != "$PACKAGE" ]; then
            echo "::error::tag v$TAG vs manifest $MANIFEST / package $PACKAGE — bump BOTH extension/manifest.json and package.json (same value)"
            exit 1
          fi
          echo "VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Build extension zip
        run: |
          ZIP_NAME="chrome-bridge-extension-v${VERSION}.zip"
          (cd extension && zip -r "../$ZIP_NAME" .)
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          ls -lh "$ZIP_NAME"

      - name: Extract release notes from the annotated tag
        run: |
          {
            echo "NOTES<<EOF"
            git tag -l "v$VERSION" --format='%(contents)'
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ env.VERSION }}
          body: ${{ env.NOTES }}
          generate_release_notes: true
          append_body: true
          files: ${{ env.ZIP_NAME }}

      - name: Unblock the CWS item (cancel a pending review)
        if: ${{ vars.CHROME_PUBLISH == 'true' }}
        continue-on-error: true
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        run: |
          if [ -z "$CHROME_PUBLISHER_ID" ]; then echo "no CHROME_PUBLISHER_ID secret — skipping unblock (a pending review would fail the upload with ITEM_NOT_UPDATABLE)"; exit 0; fi
          TOKEN=$(curl -fsS -X POST https://oauth2.googleapis.com/token \
            -d "client_id=$CHROME_CLIENT_ID" -d "client_secret=$CHROME_CLIENT_SECRET" \
            -d "refresh_token=$CHROME_REFRESH_TOKEN" -d "grant_type=refresh_token" \
            | node -pe 'JSON.parse(require("fs").readFileSync(0)).access_token')
          code=$(curl -sS -o /tmp/cws-cancel.json -w '%{http_code}' -X POST \
            "https://chromewebstore.googleapis.com/v2/publishers/$CHROME_PUBLISHER_ID/items/$CHROME_EXTENSION_ID:cancelSubmission" \
            -H "Authorization: Bearer $TOKEN" -H 'content-length: 0')
          if [ "$code" = 200 ]; then
            echo "cancelled a pending submission — the item is unlocked for upload"
          else
            echo "no pending submission to cancel (HTTP $code): $(head -c 300 /tmp/cws-cancel.json)"
          fi

      - name: Upload to Chrome Web Store (draft)
        if: ${{ vars.CHROME_PUBLISH == 'true' }}
        uses: mnao305/chrome-extension-upload@v6.0.0
        continue-on-error: true
        with:
          file-path: ${{ env.ZIP_NAME }}
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          # `publish: false` uploads as a draft — review in the CWS dashboard,
          # then click Publish. Flip to `true` once you trust the pipeline.
          # ITEM_NOT_UPDATABLE means a previous version is pending review: the
          # Unblock step above cancels those when CHROME_PUBLISHER_ID is set —
          # if you still see it, the cancel failed (check its step log) or the
          # secret is missing; cancel by hand in the dashboard and re-run.
          publish: false
