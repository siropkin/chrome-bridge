name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    # Wedged check ≠ 6h of runner time (GitHub's default is 360).
    timeout-minutes: 10
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node test/selftest.mjs
