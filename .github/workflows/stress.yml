# Real-extension stress suite in CI — the only automated gate that runs the
# ACTUAL extension (the selftest's fake echoes commands back; most issues are
# ext: issues). Chrome for Testing + xvfb: branded Chrome 137+ ignores
# --load-extension, CfT still honors it, and the pixel/dialog/trusted
# sections need a real rendering window.
# Called from test.yml (pushes/PRs) and release.yml (tag gate) — one
# definition, so the two call sites can't drift.
name: stress

on:
  workflow_call:

jobs:
  stress:
    runs-on: ubuntu-latest
    # A wedged suite ≠ hours of runner time; a healthy run is ~10 min.
    timeout-minutes: 25
    env:
      # api/slow's 800ms + CI slowness outruns the 3s --diff settle window
      # (issue55's nav verdict can't land). Job-level: whichever step starts
      # the fixture server, the knob reaches it.
      SLOW_MS: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          install-dependencies: true
      - name: Bridge up, Chrome launched with the extension
        run: |
          # Ubuntu 23.10+ AppArmor blocks unprivileged user namespaces →
          # Chrome's zygote dies with "No usable sandbox!". The documented
          # knob (keeps the sandbox; --no-sandbox is the worse fix).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          node cli.mjs start
          # xvfb headful, NOT --headless=new: the extension lives on
          # chrome.debugger, and chrome.debugger does not work in headless
          # (every attach fails → 100% captureVisibleTab fallback, verified
          # round 5). Under xvfb, hidden-tab captures still flake (no
          # BeginFrames on Linux background tabs) — the suite activates tabs
          # for mechanics tests in CI and skips macOS-only purity asserts.
          xvfb-run --server-args="-screen 0 1280x900x24" "${{ steps.chrome.outputs.chrome-path }}" \
            --user-data-dir="$(mktemp -d)" --no-first-run --no-default-browser-check \
            --window-size=1280,900 \
            --disable-background-timer-throttling --disable-renderer-backgrounding \
            --disable-backgrounding-occluded-windows --remote-debugging-port=9222 \
            --load-extension="$PWD/extension" about:blank >/tmp/chrome.log 2>&1 &
      # Also proves local authentication against real Chrome: Chrome starts
      # AFTER the server with its own --user-data-dir, so the extension's first
      # dial has no key (&nokey=not-found); the server finds that folder in ps,
      # registers its native host there, and the retry must authenticate. A
      # legacy (unauthenticated) seat fails the job.
      # A fresh profile has Developer mode off, and Chrome disables an
      # unpacked extension when it reloads then — the doctor section's
      # extreload never came back (its follow-up checks passed vacuously on
      # "extension not connected"). A real unpacked install has it on.
      - name: Developer mode on, like a real unpacked install
        run: |
          for i in $(seq 1 20); do curl -s localhost:9222/json/version >/dev/null && break; sleep 1; done
          node test/stress/devmode.mjs 9222
      - name: Wait for the extension seat (90s cap)
        run: |
          for i in $(seq 1 30); do
            if node cli.mjs health 2>/dev/null | grep -q '"extension":true'; then
              node cli.mjs profiles | grep -q '"legacy":true' && { echo "extension seated WITHOUT authentication"; node cli.mjs health; exit 1; }
              exit 0
            fi
            sleep 3
          done
          node cli.mjs health || true
          echo "--- chrome log tail:"; tail -20 /tmp/chrome.log
          exit 1
      # Ground truth about the CI page environment in one shot (Linux hidden
      # tabs differ from macOS: rAF/BeginFrame gaps, timer throttling) — when
      # the suite goes red, THIS output says whether the gap is environmental.
      - name: Probe the CI page environment
        continue-on-error: true
        run: |
          ( node test/stress/server.mjs &>/dev/null & ); sleep 1
          node cli.mjs open http://localhost:9334/fixtures/editor.html || true
          sleep 2
          node cli.mjs eval editor.html "JSON.stringify({rs:document.readyState, vis:document.visibilityState, plain:!!document.getElementById('plain'), focus:document.hasFocus()})" || true
          node cli.mjs eval editor.html "Promise.race([new Promise(r=>requestAnimationFrame(()=>r('raf fired'))), new Promise(r=>setTimeout(()=>r('raf silent for 2s'),2000))])" || true
          node cli.mjs eval editor.html "new Promise(r=>{const t0=Date.now();setTimeout(()=>r('1s timer took '+(Date.now()-t0)+'ms'),1000)})" || true
          node cli.mjs shot editor.html /tmp/probe.png || true
          node cli.mjs close editor.html || true
      # Two-profile sections (profiles/churn/interact) need a second Chrome and
      # stay manual; file:// fixtures become http:// (extension file-URL access
      # isn't guaranteed here — the suite's own :9334 server serves /fixtures).
      - name: Stress suite (single-profile sections)
        run: FX=http://localhost:9334/fixtures test/stress/run.sh dialog pixel waits net marks misc edges ids refs type trusted issues safety doctor cleanup
      - name: Suite logs on failure
        if: failure()
        run: |
          for f in test/stress/out/*; do [ -e "$f" ] || continue; echo "=== $f"; tail -40 "$f"; done
          echo "=== chrome log"; tail -50 /tmp/chrome.log

  # Local authentication's Windows path, end to end — nothing else exercises
  # it (the suite above is Linux; selftest's fake extension never asks Chrome
  # for the key). Chrome runs a non-.exe native host through cmd.exe, finds it
  # through HKCU\Software\Google\Chrome\NativeMessagingHosts, and allows the
  # unpacked extension whose id is the SHA-256 of its UTF-16 path
  # (nativehost.mjs). authsmoke.mjs: authenticated seat (not legacy) → a
  # command round trip → extreload comes back authenticated → the host
  # registration names this checkout's id → unregister removes the registry
  # values, register brings them back.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      # One step: a background process started in a Windows step isn't
      # guaranteed to outlive it. Chrome starts AFTER the server with its own
      # --user-data-dir, like an agent's Chrome. Headful: chrome.debugger
      # doesn't work headless.
      - name: Bridge, Chrome with the extension, local-auth smoke
        run: |
          node cli.mjs start
          ( node test/stress/server.mjs >/dev/null 2>&1 & )
          udd=$(mktemp -d)
          "${{ steps.chrome.outputs.chrome-path }}" --user-data-dir="$(cygpath -w "$udd")" --no-first-run --no-default-browser-check \
            --remote-debugging-port=9222 --load-extension="$(cygpath -w "$PWD/extension")" about:blank >chrome.log 2>&1 &
          for i in $(seq 1 30); do curl -s localhost:9222/json/version >/dev/null && break; sleep 1; done
          node test/stress/devmode.mjs 9222
          node test/stress/authsmoke.mjs --uninstall
          # stop is a signed /stop too; the port must actually free up
          node cli.mjs stop
          sleep 1
          if curl -s localhost:9333/health; then echo "server still up after cli stop"; exit 1; fi
      - name: Logs on failure
        if: failure()
        run: |
          node cli.mjs health || true
          echo "=== server.log"; tail -60 server.log || true
          echo "=== key folder"; ls -la "$LOCALAPPDATA/chrome-bridge" || true
          for f in "$LOCALAPPDATA"/chrome-bridge/*.json "$LOCALAPPDATA"/chrome-bridge/native-host.cmd; do echo "=== $f"; cat "$f" || true; done
          echo "=== registry"; MSYS_NO_PATHCONV=1 reg query 'HKCU\Software\Google\Chrome\NativeMessagingHosts' /s || true
          echo "=== chrome.log"; tail -60 chrome.log || true
