<!doctype html>
<meta charset="utf-8">
<title>chrome-bridge</title>
<style>
  body { width: 280px; margin: 0; padding: 12px; font: 13px system-ui, sans-serif; color: #1f1333; background: #fff; }
  #bridge-status { display: flex; align-items: center; gap: 6px; font-weight: 600; margin-bottom: 10px; }
  #bridge-status .dot { width: 9px; height: 9px; border-radius: 50%; background: #bbb; }
  #bridge-status.ok .dot { background: #22c55e; }
  #bridge-status.down .dot { background: #d4d4d8; }
  #bridge-status.down { color: #71717a; }
  #title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 8px; }
  #ref { font: 12px ui-monospace, monospace; background: #ede9fe; color: #5b21b6; border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; }
  /* Same violet→indigo→cyan gradient as the in-page pill; a 1px border can't
     hold a gradient (border-image would kill the radius), so secondary buttons
     anchor on the gradient's violet stop instead. */
  button { width: 100%; padding: 7px 0; border: 0; border-radius: 8px; background: linear-gradient(135deg, #7c3aed, #4f46e5, #0e7490); color: #fff; font: 600 13px system-ui, sans-serif; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #release-tab, #setup { background: #fff; color: #7c3aed; border: 1px solid #7c3aed; margin-top: 6px; }
  #release-all { margin-top: 6px; }
  #driven-count { color: #5b21b6; font-weight: 600; margin-top: 6px; }
  #status { min-height: 15px; margin-top: 6px; color: #5b21b6; font-size: 12px; }
  .hint { margin-top: 6px; color: #6b5f85; font-size: 11px; } /* AA on white — #8a7ca8 was 3.8:1 */
  .divider { border-top: 1px solid #ede9fe; margin: 10px 0; }
  #rate { display: block; margin-top: 8px; text-align: center; color: #7c3aed; font-size: 11px; text-decoration: none; }
  #rate:hover { text-decoration: underline; }
</style>
<div id="bridge-status" role="status"><span class="dot"></span><span id="status-text">checking…</span></div>
<div id="title">…</div>
<div id="ref"></div>
<button id="copy">Copy tab reference</button>
<div id="driven" hidden>
  <div class="divider"></div>
  <div id="driven-count"></div>
  <button id="release-tab" hidden>⏏ Release this tab</button>
  <button id="release-all">Release all agent tabs</button>
</div>
<div class="divider"></div>
<button id="setup">Copy setup prompt for your AI agent</button>
<div class="hint">Paste it to your agent (Claude, Cursor, …) — it installs and verifies everything itself.</div>
<div id="status" role="status"></div>
<a id="rate" href="https://chromewebstore.google.com/detail/chrome-bridge/kmhjlnokjigmnimgjjmiahlinjbcebkg" target="_blank" rel="noopener">★ Rate it on the Chrome Web Store</a>
<script src="popup.js"></script>
