<!doctype html>
<meta charset="utf-8">
<title>chrome-bridge</title>
<style>
  body { width: 280px; margin: 0; padding: 12px; font: 13px system-ui, sans-serif; color: #1f1333; background: #fff; }
  #bridge-status { display: flex; align-items: center; gap: 6px; font-weight: 600; margin-bottom: 10px; }
  #bridge-status .dot { width: 9px; height: 9px; border-radius: 50%; background: #bbb; }
  #bridge-status.ok .dot { background: #22c55e; }
  #bridge-status.down .dot { background: #d4d4d8; }
  #bridge-status.down { color: #71717a; }
  #title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 8px; }
  #ref { font: 12px ui-monospace, monospace; background: #f3e8ff; color: #6b21a8; border-radius: 6px; padding: 6px 8px; margin-bottom: 8px; }
  button { width: 100%; padding: 7px 0; border: 0; border-radius: 8px; background: #9333ea; color: #fff; font: 600 13px system-ui, sans-serif; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #setup { background: #fff; color: #9333ea; border: 1px solid #9333ea; margin-top: 6px; }
  #status { min-height: 15px; margin-top: 6px; color: #6b21a8; font-size: 12px; }
  .hint { margin-top: 6px; color: #8a7ca8; font-size: 11px; }
  .divider { border-top: 1px solid #ede9fe; margin: 10px 0; }
</style>
<div id="bridge-status" role="status"><span class="dot"></span><span id="status-text">checking…</span></div>
<div id="title">…</div>
<div id="ref"></div>
<button id="copy">Copy tab reference</button>
<div class="divider"></div>
<button id="setup">Copy setup prompt for your AI agent</button>
<div class="hint">Paste it to your agent (Claude, Cursor, …) — it installs and verifies everything itself.</div>
<div id="status" role="status"></div>
<script src="popup.js"></script>
