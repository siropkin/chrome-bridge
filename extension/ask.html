<!doctype html>
<meta charset="utf-8">
<title>chrome-bridge — allow this?</title>
<style>
  body { box-sizing: border-box; margin: 0; padding: 20px 22px; font: 14px system-ui, sans-serif; color: #1f1333; background: #fff; }
  .who { margin: 0 0 6px; color: #6b5f85; }
  h1 { margin: 0 0 4px; font-size: 18px; line-height: 1.3; }
  .site { margin: 0 0 12px; }
  .site b { color: #5b21b6; }
  pre { margin: 0 0 16px; max-height: 84px; overflow: auto; padding: 8px 10px; border-radius: 6px; background: #f5f3ff; color: #3f3555; font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .button-row { display: flex; gap: 10px; }
  button { flex: 1; padding: 10px 0; border: 0; border-radius: 8px; background: linear-gradient(135deg, #7c3aed, #4f46e5, #0e7490); color: #fff; font: 600 14px system-ui, sans-serif; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: #fff; color: #7c3aed; border: 1px solid #c4b5fd; }
  .hint { margin: 14px 0 0; color: #6b5f85; font-size: 12px; line-height: 1.5; }
  .hint a { color: #7c3aed; font-weight: 600; text-decoration: none; }
  .hint a:hover { text-decoration: underline; }
  #gone { color: #3f3555; line-height: 1.5; }
  @media (prefers-color-scheme: dark) {
    body { background: #16131f; color: #eee; }
    .who, .hint { color: #b4a9cc; }
    .site b, .hint a { color: #c4b5fd; }
    pre { background: #241d36; color: #ddd6fe; }
    button.secondary { background: #16131f; color: #c4b5fd; border-color: #5b4b8a; }
    #gone { color: #ddd6fe; }
  }
</style>

<!-- One Cloud Bridge step waiting for the person's yes or no (ask.js). -->
<main id="question" hidden>
  <p class="who"><span id="app">An AI app</span> wants to</p>
  <h1 id="title"></h1>
  <p class="site" id="site-line" hidden>on <b id="site"></b></p>
  <pre id="line" hidden></pre>
  <div class="button-row">
    <button id="deny" class="secondary" disabled>Deny</button>
    <button id="once" disabled>Allow once</button>
  </div>
  <p class="hint"><span id="left">No answer within 45 seconds means no.</span> <a id="settings" target="_blank" rel="noopener" hidden>Change what AI apps may do</a></p>
</main>
<p id="gone" hidden></p>
<script src="ask.js"></script>
